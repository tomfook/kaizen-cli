name: Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # knowledge/ is a symlink to $KAIZEN_KNOWLEDGE_DIR (not in repo)
          args: >-
            --no-progress
            --exclude '^https?://'
            --exclude 'knowledge/'
            '**/*.md'
          fail: true
